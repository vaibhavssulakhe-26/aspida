<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aspida heavy page</title>
  <style>body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; } a { display: block; }</style>
</head>
<body>
  <h1>5,000 links</h1>
  <p>Performance check: Aspida only pre-checks links near the viewport (IntersectionObserver), batches requests, and caps work per page. Scrolling should stay smooth.</p>
  <div id="links"></div>
  <script>
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 5000; i++) {
      const a = document.createElement('a');
      a.id = `l${i}`;
      a.href = i % 50 === 0 ? `https://sbi-offer-${i}.test/login` : `https://example-${i}.org/page/${i}`;
      a.textContent = `Link ${i}: ${a.href}`;
      frag.append(a);
    }
    document.getElementById('links').append(frag);
  </script>
</body>
</html>
